[workspace]
resolver = "2"
members = [
  "crates/shared",
  "crates/dsp",
  "crates/audio-engine",
  "crates/mixer",
  "crates/effects",
  "crates/synths",
  "crates/sampler",
  "crates/vst",
  "crates/sequencer",
  "crates/arrangement",
  "crates/piano-roll",
  "crates/automation",
  "crates/fileio",
  "crates/plugins",
  "crates/export",
  "crates/app",
]
exclude = ["tools/flp-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["REDRAW"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
flate2 = "1"
crc32fast = "1"
rtrb = "0.3"
cpal = "0.15"
hound = "3.5"
rustfft = "6"
midly = { version = "0.5", default-features = false, features = ["std"] }
midir = "0.10"
libloading = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

[profile.dev]
opt-level = 1

